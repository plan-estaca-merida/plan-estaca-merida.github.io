/* Portada con el logo de la estaca */
.cover{position:fixed;inset:0;z-index:70;background:var(--cover-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));

th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
td.heat{text-align:center;font-weight:700;min-width:2.6rem}
.bname{font-weight:700;color:var(--accent);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* barrio view */
.chips{display:flex;flex-direction:column;gap:6px}
.chips .eyebrow{margin-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px;font-weight:700;font-size:.95rem;
  display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.chip .n{font-weight:400;font-size:.8rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.85}
.blayout{display:flex;flex-direction:column;gap:20px}
.bmain{display:flex;flex-direction:column;gap:20px;min-width:0}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bhead h2{font-size:clamp(1.5rem,4vw,2rem)}
.mini{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.mini b{color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem}
.fbtn[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:10px;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.person .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.person .nm{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.person .meta{color:var(--muted);font-size:.85rem}
.person .ord{font-size:.9rem}
.person .ord b{font-weight:700}
.edit{border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.steps button{border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:.8rem;font-weight:700;color:var(--muted)}
.steps button[aria-pressed="true"][data-e="En preparación"]{background:var(--prep-soft);color:var(--prep)}
.steps button[aria-pressed="true"][data-e="Listo"]{background:var(--listo-soft);color:var(--listo)}
.steps button[aria-pressed="true"][data-e="Completada"]{background:var(--comp-soft);color:var(--comp)}
.steps button:disabled{cursor:default}
.tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.1rem;margin-bottom:4px}

/* semana */
.weekbar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.weekbar .lab{text-align:center;flex:1}
.weekbar .lab b{display:block;font-family:var(--f-display);font-size:1.2rem}
.weekbar .lab span{font-size:.8rem;color:var(--muted)}
.icon{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;flex:none}
.icon:disabled{opacity:.4}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field label{font-size:.92rem;min-width:0}
.field .grp{font-size:.7rem;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.06em}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:1.15rem;font-weight:700}
.stepper input{width:3.2rem;height:38px;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.savebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.savebar .st{font-size:.88rem;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hist button{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;text-align:left;font-size:.9rem}
.hist button:hover{background:var(--surface-2)}
.hist .muted{color:var(--muted);font-size:.82rem}

/* plan */
.plan h3{font-size:1.05rem;margin-bottom:8px}
.plan p{margin:0 0 8px;max-width:68ch}
.plan .ref{color:var(--muted);font-size:.85rem}
.plan .how{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.dot{color:var(--accent);font-size:1.1rem}
.steps-list{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px;max-width:68ch}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,15,22,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:760px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:1.25rem}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font-weight:700;font-size:.88rem}
.fl input,.fl select{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);width:100%}
.fl .hint{font-size:.8rem;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
:root.mode-pc .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
footer.note{color:var(--muted);font-size:.8rem;max-width:72ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="layer"></div>

<script>
(() => {
const BARRIOS = [
  ["la-vuelta","La Vuelta"],["las-americas","Las Américas"],["el-castor","El Castor"],["ejido","Ejido"],
  ["lagunillas","Lagunillas"],["santa-barbara","Santa Bárbara"],["vigia","Vigía"],["chama","Chama"]];
const BNAME = Object.fromEntries(BARRIOS);
const ORGS = ["Primaria","Mujeres Jóvenes","Sacerdocio Aarónico (Hombres Jóvenes)","Sociedad de Socorro","Cuórum de Élderes"];
const ORDS = ["Bautismo y confirmación","Santa Cena","Sacerdocio Aarónico","Bautismos por los muertos","Bendición patriarcal","Sacerdocio de Melquisedec","Investidura","Sellamiento"];
// Tabla de responsabilidad del plan del Área (qué siguiente ordenanza atiende cada organización)
const RESP = {
  "Primaria":[1,1,1,1,0,0,0,0],
  "Mujeres Jóvenes":[0,1,0,1,1,0,1,0],
  "Sacerdocio Aarónico (Hombres Jóvenes)":[0,1,1,1,1,1,1,0],
  "Sociedad de Socorro":[0,1,0,1,1,0,1,1],
  "Cuórum de Élderes":[0,1,1,1,1,1,1,1]};
const ESTADOS = ["En preparación","Listo","Completada"];
const WF = [ // campos del reporte semanal
  ["bc","Bautismos y conf.","Ordenanzas"],["sa","Sacerdocio Aarónico","Ordenanzas"],["bp","Bendiciones patriarcales","Ordenanzas"],
  ["inv","Investiduras","Ordenanzas"],["sel","Sellamientos","Ordenanzas"],["bpm","Bautismos por los muertos","Ordenanzas"],
  ["ent","Entrevistas significativas","Ministerio"],["pad","Padres apoyados","Ministerio"]];
const ORDK = ["bc","sa","bp","inv","sel","bpm"];
// Consejo de barrio: quién llena qué
const ROLES = [
  {id:"obispado", name:"Obispado", who:"Obispo y consejeros", org:"Sacerdocio Aarónico (Hombres Jóvenes)", fields:["bc","sa","bp","inv","sel","bpm","ent","pad"]},
  {id:"eq", name:"Cuórum de Élderes", who:"Presidente del cuórum", org:"Cuórum de Élderes", fields:["ent","pad"]},
  {id:"rs", name:"Sociedad de Socorro", who:"Presidenta", org:"Sociedad de Socorro", fields:["ent","pad"]},
  {id:"mj", name:"Mujeres Jóvenes", who:"Presidenta", org:"Mujeres Jóvenes", fields:["ent","pad"]},
  {id:"pri", name:"Primaria", who:"Presidenta", org:"Primaria", fields:["pad"]},
  {id:"todos", name:"Todos", who:"Vista completa del consejo de barrio", org:null, fields:[]}];

const busy = new Set();
const S = { personas:[], semanas:[], lideres:[], loadedP:false, loadedW:false, loadedL:false, db:null, canWrite:null, owner:false, dbState:"wait",
  tab:"plan", rol:null, barrio:null, sub:"stats", erol:"todos", esub:"stats", pfiltro:"todas", pbarrio:"", fopen:null, filtro:"Todos", week:null, draft:null, dirty:false };

const $app = document.getElementById("app"), $layer = document.getElementById("layer"), $conn = document.getElementById("conn");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

/* ---------- fechas ---------- */
const pad2 = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt = s => { const d = parse(s); return d.getDate()+" "+MESES[d.getMonth()]; };
const FIRST = "2026-01-04", LAST = "2026-12-27";
function lastSunday(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); let s = iso(d); if (s<FIRST) s=FIRST; if (s>LAST) s=LAST; return s; }
function addWeeks(s,n){ const d = parse(s); d.setDate(d.getDate()+7*n); return iso(d); }
function allWeeks(){ const out=[]; for (let s=FIRST; s<=LAST; s=addWeeks(s,1)) out.push(s); return out; }
const WEEKS = allWeeks();
const weekNo = s => WEEKS.indexOf(s)+1;

/* ---------- cálculos ---------- */
function resumen(slug){
  const ps = slug ? S.personas.filter(p=>p.barrio===slug) : S.personas;
  const ws = slug ? S.semanas.filter(w=>w.barrio===slug) : S.semanas;
  const r = { personas: ps.length, prep:0, listo:0, comp:0, ord:0, ent:0, pad:0 };
  ORDK.forEach(k=>r[k]=0);
  ps.forEach(p=>{ if(p.estado==="En preparación")r.prep++; else if(p.estado==="Listo")r.listo++; else if(p.estado==="Completada")r.comp++; });
  ws.forEach(w=>{ ORDK.forEach(k=>{ r[k]+= +w[k]||0; }); r.ent += +w.ent||0; r.pad += +w.pad||0; });
  r.ord = ORDK.reduce((a,k)=>a+r[k],0);
  return r;
}

/* ---------- render ---------- */
function setTab(t, push=true){
  S.tab = t;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===t ? "page" : "false"));
  if (push){ try{ history.replaceState(null,"", "#"+(t==="barrio" && S.barrio ? S.barrio+(S.rol?"."+S.rol:"") : t==="estaca" && S.erol && S.erol!=="todos" ? "estaca."+S.erol : t)); }catch(e){} }
  render(); window.scrollTo({top:0});
}
document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) setTab(b.dataset.tab); });

function render(){
  if (S.tab==="estaca") $app.innerHTML = viewEstaca();
  else if (S.tab==="barrio") $app.innerHTML = viewBarrio();
  else $app.innerHTML = viewPlan();
}

function statusBanner(){ return `<div class="banner demo"><b>Versión de prueba.</b> Puedes tocar y probar todo: lo que cambies se guarda solo en este teléfono o computadora. <button class="edit" onclick="window.__demoReset()">Volver a los ejemplos</button></div>` + statusBanner0(); }
function statusBanner0(){
  if (S.dbState==="none") return `<div class="banner warn">Para ver y llenar los datos, abre este enlace con la sesión de Claude iniciada. Si ya la iniciaste, pide al secretario de estaca que te dé acceso.</div>`;
  if (S.dbState==="error") return `<div class="banner err">No se pudo conectar con los datos. Cierra y vuelve a abrir la página.</div>`;
  return "";
}

/* ---------- estaca: vista según llamamiento ---------- */
const EROLES = [
  {id:"todos", name:"Estaca · vista general", who:"Presidencia de estaca y todo el consejo", org:null, rol:null, lorg:"presidencia"},
  {id:"ss", name:"Sociedad de Socorro", who:"Presidencia de estaca", org:"Sociedad de Socorro", rol:"rs", lorg:"ss", worg:"rs"},
  {id:"eq", name:"Cuórum de Élderes", who:"Sumo consejero asignado", org:"Cuórum de Élderes", rol:"eq", lorg:"sumo", worg:"eq"},
  {id:"hj", name:"Hombres Jóvenes", who:"Presidencia de estaca", org:"Sacerdocio Aarónico (Hombres Jóvenes)", rol:"obispado", lorg:"hj", worg:"obispado"},
  {id:"mj", name:"Mujeres Jóvenes", who:"Presidencia de estaca", org:"Mujeres Jóvenes", rol:"mj", lorg:"mj", worg:"mj"},
  {id:"pri", name:"Primaria", who:"Presidencia de estaca", org:"Primaria", rol:"pri", lorg:"pri", worg:"pri"}];

function viewEstaca(){
  const er = EROLES.find(x=>x.id===S.erol) || EROLES[0];
  const elid = principales(lideresDe("estaca", er.lorg));
  const sub = S.esub, pc = isPC();
  const body = sub==="planes" ? viewPlanesEstaca(er) : sub==="lideres" ? viewConsejo("estaca") : (er.id==="todos" ? estacaAllStats() : viewStatsOrg(er));
  const picker = `<div class="chips" role="group" aria-label="Ver como líder de estaca"><span class="eyebrow">Ver como líder de estaca</span>${EROLES.map(x=>{
      const n = S.personas.filter(p=>!x.org||p.org===x.org).length;
      const l = principales(lideresDe("estaca", x.lorg))[0];
      return `<button class="chip echip" data-erol="${x.id}" aria-pressed="${x.id===er.id}"><span class="el"><b>${esc(x.id==="todos"?"Estaca · vista general":x.name)}</b>${l?`<small>${esc(l.nombre)}</small>`:""}</span><span class="n num">${n} ${n===1?"persona":"personas"}</span></button>`; }).join("")}</div>`;
  const main = `
    <div class="hero">
      <span class="eyebrow">Énfasis del Área del Caribe 2026 · Estaca de Sión Mérida</span>
      <h2>${er.id==="todos" ? "¿Cómo va la estaca?" : esc(er.name)+" en la estaca"}</h2>
      <p>${er.id==="todos" ? "Se actualiza solo con lo que cada barrio anota. Toca un barrio en la tabla para ver su detalle." : "Todos los barrios, solo lo de "+esc(er.name)+"."}${elid.length?` <b>${esc(elid.map(lidTxt).join(" · "))}</b>`:""}</p>
    </div>
    ${pc?"":picker}
    <div class="seg three" role="group" aria-label="Sección de estaca">
      <button data-esub="stats" aria-pressed="${sub==="stats"}">Estadísticas</button>
      <button data-esub="planes" aria-pressed="${sub==="planes"}">Personas y planes</button>
      <button data-esub="lideres" aria-pressed="${sub==="lideres"}">Líderes</button>
    </div>
    ${sub==="stats"?`<div class="sharebar"><button class="btn wa" data-share="estaca">Copiar resumen para WhatsApp</button></div>${pendientesCard(S.personas.filter(p=>!er.org||p.org===er.org), "Planes de acción en la estaca")}`:""}
    ${body}
    ${sub==="lideres"?enlacesCard("estaca"):""}
    <footer class="note">Herramienta local de apoyo. No es un documento oficial de La Iglesia de Jesucristo de los Santos de los Últimos Días.</footer>`;
  return `<section class="view">${statusBanner()}
    <div class="blayout">${pc?`<aside>${picker}</aside>`:""}<div class="bmain">${main}</div></div></section>`;
}

function viewStatsOrg(er){
  const ps = S.personas.filter(p=>p.org===er.org);
  const ws = S.semanas.filter(w=>w.rol===er.rol);
  const now = lastSunday();
  const prep = ps.filter(p=>p.estado==="En preparación").length, listo = ps.filter(p=>p.estado==="Listo").length, comp = ps.filter(p=>p.estado==="Completada").length;
  let hT=0,aT=0; ps.forEach(p=>{ const g=progresoDe(p); hT+=g.hechas; aT+=g.total; });
  const av = aT?Math.round(hT/aT*100):0;
  const ent = ws.reduce((x,w)=>x+(+w.ent||0),0), pad = ws.reduce((x,w)=>x+(+w.pad||0),0);
  const conPlan = ps.filter(p=>p.estado!=="Completada" && planDe(p,p.ord)).length, activos = ps.filter(p=>p.estado!=="Completada").length;
  const rows = BARRIOS.map(([slug,name])=>{ const bp = ps.filter(p=>p.barrio===slug); let h=0,a=0; bp.forEach(p=>{ const g=progresoDe(p); h+=g.hechas; a+=g.total; });
    const bw = ws.filter(w=>w.barrio===slug);
    return {slug, name, n:bp.length, prep:bp.filter(p=>p.estado==="En preparación").length, listo:bp.filter(p=>p.estado==="Listo").length, comp:bp.filter(p=>p.estado==="Completada").length,
      av:a?Math.round(h/a*100):null, planes:bp.filter(p=>p.estado!=="Completada"&&planDe(p,p.ord)).length, act:bp.filter(p=>p.estado!=="Completada").length,
      ent:bw.reduce((x,w)=>x+(+w.ent||0),0), pad:bw.reduce((x,w)=>x+(+w.pad||0),0), sem: bw.some(w=>w.fecha===now),
      lid: principales(lideresDe(slug, er.worg)).map(l=>l.nombre).join(", ")}; });
  const ordsOrg = ORDS.filter((o,i)=>RESP[er.org][i] || ps.some(p=>p.ord===o));
  const M = ordsOrg.map(o=>BARRIOS.map(([slug])=>ps.filter(p=>p.barrio===slug&&p.ord===o&&(p.estado==="En preparación"||p.estado==="Listo")).length));
  const maxM = Math.max(1,...M.flat());
  const heat = v => v ? `style="background:rgba(var(--heat),${(0.12+0.6*v/maxM).toFixed(2)})"` : "";
  const bar = (v,col) => v===null?"·":`<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:48px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${v}%;background:${col}"></span></span>${v}%</span>`;
  return `
  <div class="kpis">
    <div class="kpi"><b class="num">${ps.length}</b><span>Personas de ${esc(er.name)}</span></div>

function viewPlanesEstaca(er){
  const f = S.pfiltro;
  let ps = S.personas.filter(p=>!er.org || p.org===er.org);
  if (S.pbarrio) ps = ps.filter(p=>p.barrio===S.pbarrio);
  const act = ps.filter(p=>p.estado!=="Completada");
  const con = act.filter(p=>planDe(p,p.ord)), sin = act.filter(p=>!planDe(p,p.ord));
  const venc = ps.filter(p=>ORDS.some(o=>vencido(p,o)));
  const list = f==="con" ? con : f==="sin" ? sin : f==="venc" ? venc : ps;
  const groups = BARRIOS.map(([slug,name])=>({slug,name, ps:list.filter(p=>p.barrio===slug).sort((a,b)=>String(a.nombre).localeCompare(b.nombre,"es"))})).filter(g=>g.ps.length);
  return `<div class="card">
    <div class="toolbar"><div class="filters" role="group" aria-label="Filtrar">
      <button class="fbtn" data-pf="todas" aria-pressed="${f==="todas"}">Todas <span class="num">${ps.length}</span></button>
      <button class="fbtn" data-pf="con" aria-pressed="${f==="con"}">Con plan de acción <span class="num">${con.length}</span></button>
      <button class="fbtn" data-pf="sin" aria-pressed="${f==="sin"}">Sin plan de acción <span class="num">${sin.length}</span></button>
      <button class="fbtn late" data-pf="venc" aria-pressed="${f==="venc"}">Vencidos <span class="num">${venc.length}</span></button></div>
      <div class="fl" style="min-width:12rem"><label for="pbarrio" class="eyebrow">Barrio</label><select id="pbarrio"><option value="">Todos los barrios</option>${BARRIOS.map(([s,n])=>`<option value="${s}" ${S.pbarrio===s?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
    </div>
    <p class="sub" style="margin:10px 0 0">Plan de acción de la <b>siguiente ordenanza</b> de cada persona${er.org?" de "+esc(er.name):""}. Toca un nombre para ver su camino completo y todos sus planes.</p>
  </div>
  ${groups.length ? groups.map(g=>`<div class="card"><div class="row"><h2>${esc(g.name)}</h2><span class="tag">${g.ps.length} ${g.ps.length===1?"persona":"personas"}</span></div>
    <div class="plrows">${g.ps.map(p=>{ const pl = planDe(p,p.ord), done = p.estado==="Completada", np = nPlanes(p);
      return `<div class="plr"><div class="plr-h"><button class="nm nmbtn" data-ficha="${esc(p.id)}">${esc(p.nombre)}</button><span class="meta">${esc(p.org)}</span>
          <span class="pill ${done?"c":p.estado==="Listo"?"l":"p"}">${done?"Completada":esc(p.ord)+" · "+(p.estado==="Listo"?"Lista":"En preparación")}</span></div>
        ${done ? `<p class="plmeta">Completó su camino actual.</p>` : pl ? `<p class="pltxt">${esc(pl.texto)}</p><p class="plmeta">${vencido(p,p.ord)?`<b style="color:var(--danger)">Vencido</b> · `:""}${pl.resp?`Responsable: <b>${esc(pl.resp)}</b>`:""}${pl.fecha?`${pl.resp?" · ":""}Meta: <b>${esc(fmtFecha(pl.fecha))}</b>`:""}${np>1?` · ${np} planes en total`:""}</p>`
          : `<p class="plmeta" style="color:var(--prep);font-weight:700">Sin plan de acción para su siguiente ordenanza${np?` · tiene ${np} ${np===1?"plan":"planes"} en otras ordenanzas`:""}</p>`}
      </div>`; }).join("")}</div></div>`).join("")
    : `<div class="empty"><b>No hay personas con este filtro</b>Prueba con otro filtro o barrio.</div>`}`;
}

function estacaAllStats(){
  const loading = !(S.loadedP && S.loadedW);
  const R = resumen(null);
  const tot = R.prep+R.listo+R.comp;
  const maxOrd = Math.max(1,...ORDK.map(k=>R[k]));
  const rows = BARRIOS.map(([slug,name])=>({slug,name,...resumen(slug)}));
  const maxB = Math.max(1,...rows.map(r=>r.ord));
  // semanal
  const byW = {}; S.semanas.forEach(w=>{ byW[w.fecha]=(byW[w.fecha]||0)+ORDK.reduce((a,k)=>a+(+w[k]||0),0); });
  const now = lastSunday();
  const shown = WEEKS.filter(s=>s<=now);
  const maxW = Math.max(1,...shown.map(s=>byW[s]||0));
  const nice = Math.max(2, Math.ceil(maxW/10)*10);
  const cols = shown.map(s=>{ const v=byW[s]||0; return `<div class="c ${v?"":"zero"} ${s===now?"now":""}" style="height:${(v/nice*100).toFixed(1)}%" title="Semana ${weekNo(s)} (${fmt(s)}): ${v} ordenanzas"></div>`; }).join("");
  const months = []; shown.forEach((s,i)=>{ const m=parse(s).getMonth(); if(i===0||parse(shown[i-1]).getMonth()!==m) months.push([m,1]); else months[months.length-1][1]++; });
  // matriz preparación
  const prepM = ORDS.map(o=>BARRIOS.map(([slug])=>S.personas.filter(p=>p.barrio===slug&&p.ord===o&&(p.estado==="En preparación"||p.estado==="Listo")).length));
  const maxM = Math.max(1,...prepM.flat());
  const heat = v => v ? `style="background:rgba(var(--heat),${(0.12+0.6*v/maxM).toFixed(2)})"` : "";

  return `
  ${loading && S.dbState==="ok" ? `<div class="banner">Cargando datos de los barrios…</div>`:""}
  <div class="kpis">
    <div class="kpi"><b class="num">${R.personas}</b><span>Personas por nombre</span></div>
    <div class="kpi"><b class="num">${R.ord}</b><span>Ordenanzas efectuadas</span></div>
    <div class="kpi"><b class="num">${R.ent}</b><span>Entrevistas significativas</span></div>
    <div class="kpi"><b class="num">${R.pad}</b><span>Padres apoyados</span></div>
  </div>

  <div class="card">
    <h2>Personas preparándose para su próxima ordenanza</h2>
    <p class="sub">Cada persona por nombre, según su estado.</p>
    ${tot ? `<div class="pipe" role="img" aria-label="En preparación ${R.prep}, listas ${R.listo}, completadas ${R.comp}">
      <div class="p" style="flex-grow:${R.prep}">${R.prep||""}</div><div class="l" style="flex-grow:${R.listo}">${R.listo||""}</div><div class="c" style="flex-grow:${R.comp}">${R.comp||""}</div></div>` : `<div class="pipe"></div>`}
    <div class="legend">
      <span><i style="background:var(--prep)"></i>En preparación <b class="num">${R.prep}</b></span>
      <span><i style="background:var(--listo)"></i>Listas <b class="num">${R.listo}</b></span>
      <span><i style="background:var(--comp)"></i>Completadas <b class="num">${R.comp}</b></span>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Ordenanzas efectuadas por tipo</h2>
      <p class="sub">Acumulado del año, todos los barrios.</p>
      <div class="bars">${ORDK.map(k=>{ const lab=WF.find(f=>f[0]===k)[1]; return `<div class="bar"><span class="lbl" title="${esc(lab)}">${esc(lab)}</span><div class="t"><div style="width:${(R[k]/maxOrd*100).toFixed(1)}%"></div></div><span class="v num">${R[k]}</span></div>`; }).join("")}</div>
    </div>
    <div class="card">
      <h2>Ordenanzas por semana</h2>
      <p class="sub">Total de la estaca, del 4 de enero a hoy. La semana actual va marcada.</p>
      <div class="cols">
        <div class="grid" style="bottom:100%"><span class="num">${nice}</span></div>
        <div class="grid" style="bottom:50%"><span class="num">${nice/2}</span></div>
        ${cols}
      </div>
      <div class="months">${months.map(([m,n])=>`<span style="flex:${n}">${n>=3?MESES[m]:""}</span>`).join("")}</div>
    </div>
  </div>

  <div class="card">
    <h2>Por barrio</h2>
    <p class="sub">Personas registradas y totales acumulados del año.</p>
    <div class="tscroll"><table>
      <thead><tr><th>Barrio</th><th>Personas</th><th>En prep.</th><th>Listas</th><th>Compl.</th><th>Ordenanzas</th><th>Entrevistas</th><th>Padres</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="clk" data-go="${r.slug}" tabindex="0"><td><span class="bname">${esc(r.name)}</span></td><td class="num">${r.personas}</td><td class="num">${r.prep}</td><td class="num">${r.listo}</td><td class="num">${r.comp}</td>
        <td class="num"><span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:56px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${(r.ord/maxB*100).toFixed(0)}%;background:var(--accent)"></span></span>${r.ord}</span></td>
        <td class="num">${r.ent}</td><td class="num">${r.pad}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td>Total estaca</td><td class="num">${R.personas}</td><td class="num">${R.prep}</td><td class="num">${R.listo}</td><td class="num">${R.comp}</td><td class="num">${R.ord}</td><td class="num">${R.ent}</td><td class="num">${R.pad}</td></tr></tfoot>
    </table></div>
  </div>

  <div class="card">
    <h2>¿Para qué ordenanza se preparan?</h2>
    <p class="sub">Personas en preparación o listas, por siguiente ordenanza y barrio.</p>
    <div class="tscroll"><table>
      <thead><tr><th>Siguiente ordenanza</th>${BARRIOS.map(([,n])=>`<th style="text-align:center">${esc(n)}</th>`).join("")}<th>Total</th></tr></thead>
      <tbody>${ORDS.map((o,i)=>`<tr><td>${esc(o)}</td>${prepM[i].map(v=>`<td class="heat num" ${heat(v)}>${v||"·"}</td>`).join("")}<td class="num"><b>${prepM[i].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}</tbody>
    </table></div>
  </div>
  `;
}

function barrioPicker(){
  return `<div class="chips" role="group" aria-label="Elige tu barrio"><span class="eyebrow">Barrios de la estaca</span>${BARRIOS.map(([s,n])=>{ const c=S.personas.filter(p=>p.barrio===s).length;
    return `<button class="chip" data-barrio="${s}" aria-pressed="${S.barrio===s}"><span>${esc(n)}</span><span class="n num">${c} ${c===1?"persona":"personas"}</span></button>`; }).join("")}</div>`;
}

function isPC(){ return document.documentElement.classList.contains("mode-pc"); }
function roleObj(){ return ROLES.find(r=>r.id===S.rol) || null; }
function fieldLabels(keys){ return keys.map(k=>WF.find(f=>f[0]===k)[1].toLowerCase()); }
function roleFills(r){
  if (r.id==="todos") return "Ve todas las personas y el reporte de todo el consejo";
  const f = r.fields.length===WF.length ? "todas las ordenanzas efectuadas, entrevistas y padres apoyados" : fieldLabels(r.fields).join(" y ");
  return `Personas de ${r.org==="Sacerdocio Aarónico (Hombres Jóvenes)"?"Hombres Jóvenes":r.org} · ${f}`;
}

function viewBarrio(){
  const pc = isPC();
  if (!S.barrio){
    return `<section class="view">${statusBanner()}
      <div class="hero"><span class="eyebrow">Mi barrio · paso 1 de 2</span><h2>¿De qué barrio eres?</h2><p>Elige tu barrio. La página lo recuerda en este teléfono o computadora.</p></div>
      ${barrioPicker()}</section>`;
  }
  const R = resumen(S.barrio);
  const r = roleObj();
  const head = `<div class="bhead">
      <div><span class="eyebrow">Barrio</span><h2>${esc(BNAME[S.barrio])}</h2></div>
      ${pc?"":`<button class="btn ghost" data-act="chgbarrio">Cambiar barrio</button>`}
      <div class="mini"><span><b class="num">${R.personas}</b> personas</span><span><b class="num">${R.ord}</b> ordenanzas</span><span><b class="num">${R.ent}</b> entrevistas</span><span><b class="num">${R.pad}</b> padres apoyados</span></div>
    </div>`;
  let main;
  if (!r){
    main = `${head}<div class="card"><span class="eyebrow">Paso 2 de 2</span><h2 style="font-size:1.3rem;margin-top:4px">¿Quién eres en el consejo de barrio?</h2>
      <p class="sub">Elige tu llamamiento. Abajo te sale solo lo que te toca llenar.</p>
      <div class="roles">${ROLES.map(x=>`<button class="role ${x.id==="todos"?"all":""}" data-rol="${x.id}"><b>${esc(x.name)}</b><span class="who">${x.id==="todos"?esc(x.who):(()=>{ const ls=lideresDe(S.barrio,x.id); return ls.length?esc(ls.map(lidTxt).join(" · ")):esc(x.who)+' · <i>sin nombre anotado</i>'; })()}</span><span class="fills">${esc(roleFills(x))}</span></button>`).join("")}</div></div>
    ${viewConsejo()}`;
  } else {
    main = `${head}
    ${S.canWrite===false ? `<div class="banner warn">Estás en modo de solo lectura. Para anotar, pide al secretario de estaca que te invite como editor.</div>`:""}
    <div class="rolebar"><div style="min-width:0"><span class="eyebrow">Estás como</span><b>${esc(r.name)}</b>${r.id!=="todos" && lideresDe(S.barrio,r.id).length ? `<span class="fills" style="color:var(--ink)">${esc(lideresDe(S.barrio,r.id).map(lidTxt).join(" · "))}</span>`:""}<span class="fills">${esc(roleFills(r))}</span></div><button class="btn ghost" data-act="chgrol">Cambiar</button></div>
    <div class="seg" role="group" aria-label="Sección">
      <button data-sub="stats" aria-pressed="${S.sub==="stats"}">Estadísticas</button>
      <button data-sub="personas" aria-pressed="${S.sub==="personas"}">Personas por nombre</button>
      <button data-sub="semana" aria-pressed="${S.sub==="semana"}">Reporte semanal</button>
      <button data-sub="consejo" aria-pressed="${S.sub==="consejo"}">Consejo</button>
    </div>
    ${S.sub==="personas" ? viewPersonas() : S.sub==="consejo" ? viewConsejo()+enlacesCard(S.barrio) : S.sub==="stats" ? viewStatsBarrio() : (r.id==="todos" ? viewSemanaTodos() : viewSemana())}`;
  }
  return `<section class="view">${statusBanner()}
    <div class="blayout">${pc?`<aside>${barrioPicker()}</aside>`:""}<div class="bmain">${main}</div></div></section>`;
}

function viewPersonas(){
  const r = roleObj();
  const all = S.personas.filter(p=>p.barrio===S.barrio && (!r || !r.org || p.org===r.org));
  const order = {"En preparación":0,"Listo":1,"Completada":2};
  const list = all.filter(p=>S.filtro==="Todos"||p.estado===S.filtro||(S.filtro==="sinplan"&&p.estado!=="Completada"&&!planDe(p,p.ord))||(S.filtro==="vencido"&&ORDS.some(o=>vencido(p,o))))
    .sort((a,b)=>(order[a.estado]??9)-(order[b.estado]??9) || String(a.nombre).localeCompare(b.nombre,"es"));
  const cnt = e => all.filter(p=>p.estado===e).length;
  const ro = S.canWrite===false || S.dbState!=="ok";
  const quien = r && r.org ? (r.org==="Sacerdocio Aarónico (Hombres Jóvenes)" ? "de Hombres Jóvenes" : "de "+r.org) : "de todo el barrio";
  return `<div class="toolbar">
      <div class="filters" role="group" aria-label="Filtrar por estado">
        ${["Todos",...ESTADOS].map(f=>`<button class="fbtn" data-filtro="${f}" aria-pressed="${S.filtro===f}">${f==="Listo"?"Listas":f==="Completada"?"Completadas":f} <span class="num">${f==="Todos"?all.length:cnt(f)}</span></button>`).join("")}
        <button class="fbtn" data-filtro="sinplan" aria-pressed="${S.filtro==="sinplan"}">Sin plan <span class="num">${all.filter(p=>p.estado!=="Completada"&&!planDe(p,p.ord)).length}</span></button>
        <button class="fbtn late" data-filtro="vencido" aria-pressed="${S.filtro==="vencido"}">Plan vencido <span class="num">${all.filter(p=>ORDS.some(o=>vencido(p,o))).length}</span></button>
      </div>
      <button class="btn" data-act="add" ${ro?"disabled":""}>+ Agregar persona</button>
    </div>
    <p class="sub" style="margin:-6px 0 0;color:var(--muted);font-size:.88rem">Personas ${esc(quien)}.</p>
    ${!S.loadedP && S.dbState==="ok" ? `<div class="empty">Cargando personas…</div>` :
      list.length ? `<div class="plist">${list.map(p=>personCard(p,ro)).join("")}</div>` :
      `<div class="empty"><b>${all.length?"Nadie con este estado":"Aún no hay personas anotadas"}</b>${all.length?"Prueba con otro filtro.":"Toca “Agregar persona” y escribe el nombre y su siguiente ordenanza."}</div>`}
    <p class="banner">Cuando una persona avance, solo toca su nuevo estado. Se guarda al instante y la estaca lo ve enseguida.</p>`;
}
function personCard(p,ro){
  return `<article class="person">
    <div class="top2"><div style="min-width:0"><button class="nm nmbtn" data-ficha="${esc(p.id)}">${esc(p.nombre)}</button><div class="meta">${esc(p.org)}</div></div>
      <div style="display:flex;gap:6px;align-items:center">${p.ejemplo && !/ejemplo/i.test(p.nombre)?`<span class="tag">ejemplo</span>`:""}${ro?"":`<button class="edit" data-edit="${esc(p.id)}">Editar</button>`}</div></div>
    <div class="ord">Siguiente ordenanza: <b>${esc(p.ord)}</b></div>
    ${(()=>{ const g=progresoDe(p); return `<button class="pmini" data-ficha="${esc(p.id)}" aria-label="Ver camino de convenios"><span class="dots">${camino(p).map(o=>`<i class="${hechasDe(p).includes(o)?"d":o===p.ord?"n":""}"></i>`).join("")}</span><span>${g.hechas} de ${g.total} recibidas · Ver camino ›</span></button>${p.estado!=="Completada"?(planDe(p,p.ord)?(vencido(p,p.ord)?`<span class="plchip late" style="align-self:flex-start">Plan vencido · ${esc(fmtFecha(planDe(p,p.ord).fecha))}</span>`:`<span class="plchip" style="align-self:flex-start">Plan de acción listo</span>`):`<span class="plchip no" style="align-self:flex-start">Sin plan de acción</span>`):""}`; })()}
    <div class="steps" role="group" aria-label="Estado de ${esc(p.nombre)}">
      ${ESTADOS.map(e=>`<button data-estado="${e}" data-e="${e}" data-pid="${esc(p.id)}" aria-pressed="${p.estado===e}" ${ro?"disabled":""}>${e==="Listo"?"Lista":e}</button>`).join("")}
    </div></article>`;
}

function weekDoc(slug,fecha,rol){ return S.semanas.find(w=>w.barrio===slug&&w.fecha===fecha&&(w.rol||"")===rol); }
function weekBar(sub){
  return `<div class="weekbar">
      <button class="icon" data-wk="-1" aria-label="Semana anterior" ${S.week<=FIRST?"disabled":""}>‹</button>
      <div class="lab"><b>Domingo ${fmt(S.week)}</b><span>Semana ${weekNo(S.week)} de 52 · ${sub}</span></div>
      <button class="icon" data-wk="1" aria-label="Semana siguiente" ${S.week>=LAST?"disabled":""}>›</button>
    </div>`;

function viewSemana(){

  const ro = S.canWrite===false || S.dbState!=="ok";
  const hist = S.semanas.filter(w=>w.barrio===S.barrio && w.rol===r.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  </div>`;

const ORG_SHORT = {"Sacerdocio Aarónico (Hombres Jóvenes)":"Hombres Jóvenes"};
const ORG_ROL = {"Sacerdocio Aarónico (Hombres Jóvenes)":"obispado","Cuórum de Élderes":"eq","Sociedad de Socorro":"rs","Mujeres Jóvenes":"mj","Primaria":"pri"};
function viewStatsBarrio(){
  const slug = S.barrio;
  const ps = S.personas.filter(p=>p.barrio===slug), ws = S.semanas.filter(w=>w.barrio===slug);
  const R = resumen(slug);
  const tot = R.prep+R.listo+R.comp;
  const maxOrd = Math.max(1,...ORDK.map(k=>R[k]));
  const byW = {}; ws.forEach(w=>{ byW[w.fecha]=(byW[w.fecha]||0)+ORDK.reduce((a,k)=>a+(+w[k]||0),0); });
  const now = lastSunday(), shown = WEEKS.filter(s=>s<=now);
  const maxW = Math.max(1,...shown.map(s=>byW[s]||0)), nice = Math.max(2, Math.ceil(maxW/10)*10);
  const cols = shown.map(s=>{ const v=byW[s]||0; return `<div class="c ${v?"":"zero"} ${s===now?"now":""}" style="height:${(v/nice*100).toFixed(1)}%" title="Semana ${weekNo(s)} (${fmt(s)}): ${v} ordenanzas"></div>`; }).join("");
  const months = []; shown.forEach((s,i)=>{ const m=parse(s).getMonth(); if(i===0||parse(shown[i-1]).getMonth()!==m) months.push([m,1]); else months[months.length-1][1]++; });
  // camino de convenios
  let hT=0, aT=0; ps.forEach(p=>{ const g=progresoDe(p); hT+=g.hechas; aT+=g.total; });
  const avance = aT ? Math.round(hT/aT*100) : 0;
  // por organización
  const rows = ORGS.map(o=>{ const op = ps.filter(p=>p.org===o); const rid = ORG_ROL[o]; const rw = ws.filter(w=>w.rol===rid);
    let h=0,a=0; op.forEach(p=>{ const g=progresoDe(p); h+=g.hechas; a+=g.total; });
    return { name: ORG_SHORT[o]||o, n: op.length, prep: op.filter(p=>p.estado==="En preparación").length, listo: op.filter(p=>p.estado==="Listo").length,
      comp: op.filter(p=>p.estado==="Completada").length, av: a?Math.round(h/a*100):null,
      ent: rw.reduce((x,w)=>x+(+w.ent||0),0), pad: rw.reduce((x,w)=>x+(+w.pad||0),0),
      lid: lideresDe(slug, rid).filter(l=>!/secretari|consejer/i.test(l.llamamiento)).map(l=>l.nombre).join(", ") }; });
  const gen = ws.filter(w=>!w.rol);
  const genRow = gen.length ? { ent: gen.reduce((x,w)=>x+(+w.ent||0),0), pad: gen.reduce((x,w)=>x+(+w.pad||0),0) } : null;
  // matriz preparación por organización
  const M = ORDS.map(o=>ORGS.map(g=>ps.filter(p=>p.org===g&&p.ord===o&&(p.estado==="En preparación"||p.estado==="Listo")).length));
  const maxM = Math.max(1,...M.flat());
  const heat = v => v ? `style="background:rgba(var(--heat),${(0.12+0.6*v/maxM).toFixed(2)})"` : "";
  // quién falta por anotar esta semana
  const roles = ROLES.filter(x=>x.id!=="todos");
  const anot = roles.map(x=>({x, ok: ws.some(w=>w.rol===x.id && w.fecha===now)}));

  return `
  <div class="sharebar"><button class="btn wa" data-share="barrio">Copiar resumen para WhatsApp</button></div>
  <div class="kpis">
    <div class="kpi"><b class="num">${R.personas}</b><span>Personas por nombre</span></div>
    <div class="kpi"><b class="num">${R.ord}</b><span>Ordenanzas efectuadas</span></div>
    <div class="kpi"><b class="num">${R.ent}</b><span>Entrevistas significativas</span></div>
    <div class="kpi"><b class="num">${R.pad}</b><span>Padres apoyados</span></div>
  </div>
  ${pendientesCard(ps)}
  <div class="grid2">
    <div class="card">
      <h2>Personas preparándose</h2>
      <p class="sub">Cada persona por nombre, según su estado.</p>
      ${tot ? `<div class="pipe" role="img" aria-label="En preparación ${R.prep}, listas ${R.listo}, completadas ${R.comp}">
        <div class="p" style="flex-grow:${R.prep}">${R.prep||""}</div><div class="l" style="flex-grow:${R.listo}">${R.listo||""}</div><div class="c" style="flex-grow:${R.comp}">${R.comp||""}</div></div>` : `<div class="pipe"></div>`}
      <div class="legend">
        <span><i style="background:var(--prep)"></i>En preparación <b class="num">${R.prep}</b></span>
        <span><i style="background:var(--listo)"></i>Listas <b class="num">${R.listo}</b></span>
        <span><i style="background:var(--comp)"></i>Completadas <b class="num">${R.comp}</b></span>
      </div>
    </div>
    <div class="card">
      <h2>Avance en el camino de convenios</h2>
      <p class="sub">Ordenanzas recibidas de todas las personas anotadas.</p>
      <div class="fbar" style="height:14px"><div style="width:${avance}%"></div></div>
      <div class="legend"><span><b class="num">${avance}%</b> del camino recorrido</span><span><b class="num">${hT}</b> de <b class="num">${aT}</b> ordenanzas recibidas</span></div>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>Ordenanzas efectuadas por tipo</h2>
      <p class="sub">Acumulado del año en ${esc(BNAME[slug])}.</p>
      <div class="bars">${ORDK.map(k=>{ const lab=WF.find(f=>f[0]===k)[1]; return `<div class="bar"><span class="lbl" title="${esc(lab)}">${esc(lab)}</span><div class="t"><div style="width:${(R[k]/maxOrd*100).toFixed(1)}%"></div></div><span class="v num">${R[k]}</span></div>`; }).join("")}</div>
    </div>
    <div class="card">
      <h2>Ordenanzas por semana</h2>
      <p class="sub">Del 4 de enero a hoy. La semana actual va marcada.</p>
      <div class="cols">
        <div class="grid" style="bottom:100%"><span class="num">${nice}</span></div>
        <div class="grid" style="bottom:50%"><span class="num">${nice/2}</span></div>
        ${cols}
      </div>
      <div class="months">${months.map(([m,n])=>`<span style="flex:${n}">${n>=3?MESES[m]:""}</span>`).join("")}</div>
    </div>
  </div>
  <div class="card">
    <h2>Por organización</h2>
    <p class="sub">Personas de cada organización y lo que su líder ha anotado en el año.</p>
    <div class="tscroll"><table>
      <thead><tr><th>Organización</th><th>Personas</th><th>En prep.</th><th>Listas</th><th>Compl.</th><th>Camino</th><th>Entrevistas</th><th>Padres</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.lid?`<span class="tdname">${esc(r.lid)}</span>`:""}</td><td class="num">${r.n}</td><td class="num">${r.prep}</td><td class="num">${r.listo}</td><td class="num">${r.comp}</td>
        <td class="num">${r.av===null?"·":`<span style="display:inline-flex;align-items:center;gap:8px"><span style="display:inline-block;width:48px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${r.av}%;background:var(--comp)"></span></span>${r.av}%</span>`}</td>
        <td class="num">${r.ent}</td><td class="num">${r.pad}</td></tr>`).join("")}
        ${genRow?`<tr><td><b>Registro general</b><span class="tdname">datos de ejemplo del Excel</span></td><td class="num">·</td><td class="num">·</td><td class="num">·</td><td class="num">·</td><td class="num">·</td><td class="num">${genRow.ent}</td><td class="num">${genRow.pad}</td></tr>`:""}</tbody>
      <tfoot><tr><td>Total del barrio</td><td class="num">${R.personas}</td><td class="num">${R.prep}</td><td class="num">${R.listo}</td><td class="num">${R.comp}</td><td class="num">${avance}%</td><td class="num">${R.ent}</td><td class="num">${R.pad}</td></tr></tfoot>
    </table></div>
  </div>
  <div class="stack">
    <div class="card">
      <h2>¿Para qué ordenanza se preparan?</h2>

      <div class="tscroll"><table>
        <thead><tr><th>Siguiente ordenanza</th>${ORGS.map(g=>`<th style="text-align:center;white-space:normal;min-width:4.4rem">${esc(ORG_SHORT[g]||g)}</th>`).join("")}<th>Total</th></tr></thead>
        <tbody>${ORDS.map((o,i)=>`<tr><td>${esc(o)}</td>${M[i].map(v=>`<td class="heat num" ${heat(v)}>${v||"·"}</td>`).join("")}<td class="num"><b>${M[i].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="card">
      <h2>Reporte de esta semana</h2>
      <p class="sub">Domingo ${fmt(now)}: quién del consejo ya anotó.</p>
      <div class="checklist">${anot.map(a=>{ const ls=lideresDe(slug,a.x.id).filter(l=>!/secretari|consejer/i.test(l.llamamiento)); return `<div class="ck ${a.ok?"ok":""}"><span class="mk" aria-hidden="true">${a.ok?"✓":""}</span><div><b>${esc(a.x.name)}</b><span>${ls.length?esc(ls.map(l=>l.nombre).join(", "))+" · ":""}${a.ok?"Ya anotó":"Falta anotar"}</span></div></div>`; }).join("")}</div>

  {id:"sec", name:"Secretaría de estaca", calls:["Secretario de estaca","Secretario ejecutivo","Secretario auxiliar"]}];
const lorgsFor = scope => scope==="estaca" ? LORGS_E : LORGS;
const lorg = (id, scope) => lorgsFor(scope).find(o=>o.id===id);
function lideresDe(slug, orgId){

      || String(a.nombre).localeCompare(b.nombre,"es"));
}
const lidTxt = l => `${l.nombre} (${l.llamamiento})`;
const principales = ls => { const p = ls.filter(l=>!/secretari|consejer/i.test(l.llamamiento)); return p.length ? p : ls.slice(0,1); };

/* ---------- camino de convenios por persona ---------- */
const MUJ = ["Mujeres Jóvenes","Sociedad de Socorro"], HOM = ["Sacerdocio Aarónico (Hombres Jóvenes)","Cuórum de Élderes"];
const ORD_NOTA = {"Santa Cena":"Participar dignamente cada semana","Sacerdocio Aarónico":"Solo varones","Sacerdocio de Melquisedec":"Solo varones"};
const ORD_ID = {"Bautismo y confirmación":"bc","Santa Cena":"sc","Sacerdocio Aarónico":"sa","Bautismos por los muertos":"bpm","Bendición patriarcal":"bp","Sacerdocio de Melquisedec":"sm","Investidura":"inv","Sellamiento":"sel"};
function sexoDe(p){ return p.sexo || (MUJ.includes(p.org) ? "M" : HOM.includes(p.org) ? "H" : ""); }
// Ordenanzas que se repiten: no se "reciben" una sola vez, se participa con regularidad
const RECUR = ["Santa Cena","Bautismos por los muertos"];
function aplica(p){ const sx = sexoDe(p); return ORDS.filter(o => sx==="M" ? !o.startsWith("Sacerdocio") : true); }
function camino(p){ return aplica(p).filter(o=>!RECUR.includes(o)); }
function hechasDe(p){
  const cm = camino(p);
  if (Array.isArray(p.hechas)) return p.hechas.filter(o=>cm.includes(o));
  const pos = ORDS.indexOf(p.ord);
  const h = cm.filter(o=>ORDS.indexOf(o) < pos);
  if (p.estado==="Completada" && cm.includes(p.ord) && !h.includes(p.ord)) h.push(p.ord);
  return h;
}
function participa(p, o){
  const id = ORD_ID[o];
  if (p.recur && typeof p.recur[id]==="boolean") return p.recur[id];
  if (Array.isArray(p.hechas)) return p.hechas.includes(o) || (p.estado==="Completada" && p.ord===o);
  return ORDS.indexOf(o) < ORDS.indexOf(p.ord) || (p.estado==="Completada" && p.ord===o);
}
function hecha(p, o){ return RECUR.includes(o) ? participa(p,o) : hechasDe(p).includes(o); }
function progresoDe(p){ const cm=camino(p), h=hechasDe(p); return {total:cm.length, hechas:h.length}; }
function planDe(p, ord){ const x = p.planes && p.planes[ORD_ID[ord]]; return x && String(x.texto||"").trim() ? x : null; }
function nPlanes(p){ return ORDS.filter(o=>planDe(p,o)).length; }
const hoyISO = () => iso(new Date());
function vencido(p, o){ const pl = planDe(p,o); return !!(pl && pl.fecha && pl.fecha < hoyISO() && !hecha(p,o)); }
function proximo(p, o){ const pl = planDe(p,o); if(!(pl && pl.fecha) || hecha(p,o)) return false; const d=parse(pl.fecha), t=new Date(); t.setHours(0,0,0,0); const diff=(d-t)/864e5; return diff>=0 && diff<=14; }
function siguientePendiente(p, hechas, recur){
  return aplica(p).find(o => RECUR.includes(o) ? !(recur[ORD_ID[o]]) : !hechas.includes(o)) || null;
}
const fmtFecha = s => { if(!s) return ""; const d=parse(s); return d.getDate()+" "+MESES[d.getMonth()]+" "+d.getFullYear(); };
const planChip = (p,o) => { const pl=planDe(p,o); if(!pl) return ""; const v=vencido(p,o);
  return `<em class="plchip ${v?"late":""}">${v?"Plan vencido":"Plan de acción"}${pl.fecha?" · "+esc(fmtFecha(pl.fecha)):""}</em>`; };

function openFicha(id, openOrd){
  const p = S.personas.find(x=>x.id===id); if(!p) return;
  const prevScroll = $layer.querySelector(".ficha")?.scrollTop || 0;
  if (openOrd !== undefined) S.fopen = openOrd;
  const ro = S.canWrite===false || S.dbState!=="ok";
  const ap = aplica(p), cm = camino(p), h = hechasDe(p), sx = sexoDe(p);
  const rc = ap.filter(o=>RECUR.includes(o));
  const inferido = !Array.isArray(p.hechas);
  const faltan = cm.filter(o=>!h.includes(o));
  const pct = cm.length ? Math.round(h.length/cm.length*100) : 0;
  const estadoTxt = p.estado==="Listo" ? "Lista" : p.estado;
  const planBox = o => { const pl = planDe(p,o) || {}; const ide = ORD_ID[o];
    if (ro) return `<div class="planbox"><span class="eyebrow">Plan de acción</span>${planDe(p,o)?`<p class="pltxt">${esc(pl.texto)}</p><p class="plmeta">${pl.resp?`Responsable: <b>${esc(pl.resp)}</b>`:""}${pl.fecha?` · Meta: <b>${esc(fmtFecha(pl.fecha))}</b>`:""}</p>`:`<p class="plmeta">Aún no hay plan de acción para esta ordenanza.</p>`}</div>`;
    return `<div class="planbox"><span class="eyebrow">Plan de acción · ${esc(o)}</span>
      <div class="fl"><label for="pl-txt-${ide}">¿Qué haremos para que se cumpla?</label><textarea id="pl-txt-${ide}" rows="3" maxlength="1500" placeholder="Ejemplo: visitarla con su familia, enseñar la lección sobre el convenio, acompañarla a la entrevista con el obispo…">${esc(pl.texto||"")}</textarea></div>
      <div class="plgrid"><div class="fl"><label for="pl-resp-${ide}">Responsable</label><input id="pl-resp-${ide}" maxlength="80" value="${esc(pl.resp||"")}" placeholder="Quién lo hará"></div>
      <div class="fl"><label for="pl-fecha-${ide}">Fecha meta</label><input id="pl-fecha-${ide}" type="date" value="${esc(pl.fecha||"")}"></div></div>
      <div class="row" style="justify-content:flex-end"><span class="plmeta" style="margin-right:auto">${pl.actualizado?`Actualizado ${esc(fmtFecha(pl.actualizado.slice(0,10)))}`:""}</span><button class="btn ghost" data-fx="">Cerrar</button><button class="btn" data-plsave="${esc(o)}">Guardar plan</button></div></div>`; };
  const li = o => {
    const rec = RECUR.includes(o), done = hecha(p,o), next = !done && o===p.ord, open = S.fopen===o, pl = planDe(p,o);
    const cls = (done ? "done" : next ? "next "+(p.estado==="Listo"?"listo":"prep") : "pend") + (open?" open":"");
    const label = rec ? (done ? "Participa con regularidad" : next ? `Siguiente · ${estadoTxt}` : "Aún no participa") : (done ? "Recibida" : next ? `Siguiente · ${estadoTxt}` : "Le falta");
    const nota = ORD_NOTA[o] && !rec ? ` · ${ORD_NOTA[o]}` : "";
    return `<li class="${cls}"><span class="mk" aria-hidden="true">${done?"✓":next?"●":""}</span>
      <button class="tx" data-fx="${open?"":esc(o)}" aria-expanded="${open}"><b>${esc(o)} <span class="chev" aria-hidden="true">${open?"▴":"▾"}</span></b><span>${label}${nota}</span>${pl?planChip(p,o):(next?`<em class="plchip no">Sin plan de acción</em>`:"")}</button>
      ${ro?"<span></span>":`<div class="ac">${done ? `<button class="mini-btn" data-fq="${esc(o)}">${rec?"Aún no":"Quitar"}</button>` : `<button class="mini-btn ok" data-fh="${esc(o)}">${rec?"Participa":"Recibida"}</button>${next?"":`<button class="mini-btn" data-fn="${esc(o)}">Siguiente</button>`}`}</div>`}
      ${open?`<div class="plwrap">${planBox(o)}</div>`:""}
    </li>`; };
  $layer.innerHTML = `<div class="overlay" id="ov"><div class="sheet ficha" role="dialog" aria-label="Camino de convenios de ${esc(p.nombre)}">
    <div class="row" style="align-items:flex-start"><div style="min-width:0"><span class="eyebrow">${esc(BNAME[p.barrio]||"")} · ${esc(p.org)}</span><h2 style="overflow-wrap:anywhere">${esc(p.nombre)}</h2></div>
      <button class="icon" id="fclose" aria-label="Cerrar">✕</button></div>
    <div class="fprog"><div class="fbar"><div style="width:${pct}%"></div></div>
      <span><b class="num">${h.length}</b> de <b class="num">${cm.length}</b> ordenanzas recibidas · faltan <b class="num">${faltan.length}</b></span></div>
    <p class="banner" style="margin:0">Toca una ordenanza para ver o escribir su <b>plan de acción</b>.</p>
    ${sx==="" ? `<p class="banner" style="margin:0">Las ordenanzas del sacerdocio aplican solo a varones. Si es niña, edita sus datos y marca “Mujer”.</p>`:""}
    ${inferido && !ro ? `<p class="banner warn" style="margin:0">Marcamos como recibidas las ordenanzas anteriores a su siguiente ordenanza. Revisa y corrige tocando “Recibida” o “Quitar”.</p>`:""}
    <span class="eyebrow">Camino de convenios</span>
    <ol class="path">${cm.map(o=>li(o)).join("")}</ol>
    ${rc.length?`<span class="eyebrow">Participación continua</span><p class="plmeta" style="margin-top:-10px">Se repiten: lo importante es que participe con regularidad.</p>
    <ol class="path recur">${rc.map(o=>li(o)).join("")}</ol>`:""}
    <div class="row">${ro?"<span></span>":`<button class="btn ghost" id="fedit">Editar datos</button>`}<button class="btn" id="fok">Listo</button></div>
  </div></div>`;
  const sheet = $layer.querySelector(".ficha"); sheet.scrollTop = prevScroll;
  const close = () => { S.fopen=null; $layer.innerHTML=""; render(); };
  document.getElementById("fclose").onclick = close;
  document.getElementById("fok").onclick = close;
  document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") close(); });
  const fe = document.getElementById("fedit"); if (fe) fe.onclick = () => { S.fopen=null; openPerson(p.id); };
  if (S.fopen && !ro){ const ta = document.getElementById("pl-txt-"+ORD_ID[S.fopen]); if (ta && !ta.value) setTimeout(()=>ta.focus(),30); }
  sheet.addEventListener("click", async e=>{
    const fx = e.target.closest("[data-fx]");
    if (fx){ openFicha(p.id, fx.dataset.fx || null); return; }
    const ps = e.target.closest("[data-plsave]");
    if (ps){
      const o = ps.dataset.plsave, ide = ORD_ID[o];
      const obj = { texto: document.getElementById("pl-txt-"+ide).value.trim(), resp: document.getElementById("pl-resp-"+ide).value.trim(),
        fecha: document.getElementById("pl-fecha-"+ide).value || "", actualizado: new Date().toISOString() };
      ps.disabled = true;
      const prev = p.planes;
      p.planes = {...(p.planes||{}), [ide]: obj};
      try { await S.db.collection("personas").doc(p.id).update({planes:{[ide]:obj}, actualizado:obj.actualizado});
        toast(obj.texto ? "Plan de acción guardado" : "Plan de acción borrado"); openFicha(p.id, null); }
      catch(err){ p.planes = prev; ps.disabled=false; fail(err); }
      return;
    }
    const b = e.target.closest("[data-fh],[data-fq],[data-fn]"); if(!b || busy.has(p.id)) return;
    let hech = hechasDe(p).slice(), patch = {};
    const recur = {}; RECUR.forEach(o=>{ recur[ORD_ID[o]] = participa(p,o); });
    const o = b.dataset.fh || b.dataset.fq || b.dataset.fn, rec = RECUR.includes(o);
    if (b.dataset.fh){
      if (rec) recur[ORD_ID[o]] = true; else if(!hech.includes(o)) hech.push(o);
      if (o===p.ord){ const sig = siguientePendiente(p, hech, recur);
        if (sig){ patch.ord = sig; patch.estado = "En preparación"; } else patch.estado = "Completada"; } }
    if (b.dataset.fq){ if (rec) recur[ORD_ID[o]] = false; else hech = hech.filter(x=>x!==o); }
    if (b.dataset.fn){ patch.ord = o; patch.estado = "En preparación"; }
    patch.hechas = camino(p).filter(x=>hech.includes(x));
    patch.recur = recur;
    patch.actualizado = new Date().toISOString();
    busy.add(p.id); const prev = {hechas:p.hechas, recur:p.recur, ord:p.ord, estado:p.estado};
    Object.assign(p, patch); openFicha(p.id);
    try { await S.db.collection("personas").doc(p.id).update(patch);
      toast(patch.ord && patch.ord!==prev.ord ? `Siguiente ordenanza: ${patch.ord}` : "Guardado"); }
    catch(err){ Object.assign(p, prev); openFicha(p.id); fail(err); }
    finally { busy.delete(p.id); }
  });
}

/* ---------- enlaces directos, resumen para WhatsApp y pendientes ---------- */
const ART_URL = location.origin + location.pathname;
async function copiar(text){ try { await navigator.clipboard.writeText(text); return true; } catch(e){ return false; } }
function enlacesCard(scope){
  if (S.canWrite===false || S.dbState!=="ok") return "";

function openShare(title, text, copied){

    <textarea class="sharetxt" id="sharetxt" readonly rows="14">${esc(text)}</textarea>

  </div></div>`;

}
function pendientesDe(ps){
  const v=[], pr=[];
  ps.forEach(p=>ORDS.forEach(o=>{ if(vencido(p,o)) v.push({p,o,pl:planDe(p,o)}); else if(proximo(p,o)) pr.push({p,o,pl:planDe(p,o)}); }));
  const by = (a,b)=>a.pl.fecha.localeCompare(b.pl.fecha);
  return {v:v.sort(by), pr:pr.sort(by)};
}
function pendientesCard(ps, titulo){
  const act = ps.filter(p=>p.estado!=="Completada");
  const con = act.filter(p=>planDe(p,p.ord)).length;
  const {v, pr} = pendientesDe(ps);
  const row = x => `<button class="pend-row" data-ficha="${esc(x.p.id)}"><span class="pdate ${vencido(x.p,x.o)?"late":""}">${esc(fmtFecha(x.pl.fecha))}</span><span style="min-width:0"><b>${esc(x.p.nombre)}</b> · ${esc(x.o)}${S.tab==="estaca"?` <span class="muted">· ${esc(BNAME[x.p.barrio])}</span>`:""}<span class="pres">${esc(x.pl.texto.length>90?x.pl.texto.slice(0,90)+"…":x.pl.texto)}${x.pl.resp?" · "+esc(x.pl.resp):""}</span></span></button>`;
  return `<div class="card"><h2>${titulo||"Planes de acción"}</h2>
    <div class="legend" style="margin:6px 0 12px"><span><b class="num">${con}</b> de <b class="num">${act.length}</b> con plan para su siguiente ordenanza</span><span style="color:var(--danger)"><b class="num">${v.length}</b> vencidos</span><span><b class="num">${pr.length}</b> en los próximos 14 días</span></div>
    ${v.length||pr.length ? `${v.length?`<span class="eyebrow" style="color:var(--danger)">Vencidos</span><div class="pend">${v.slice(0,12).map(row).join("")}</div>`:""}
      ${pr.length?`<span class="eyebrow">Próximos 14 días</span><div class="pend">${pr.slice(0,12).map(row).join("")}</div>`:""}`
      : `<p class="plmeta">No hay planes vencidos ni próximos. Los planes con fecha meta aparecerán aquí.</p>`}
  </div>`;
}
function txtBarrio(slug){
  const R = resumen(slug), now = lastSunday();
  const ps = S.personas.filter(p=>p.barrio===slug), ws = S.semanas.filter(w=>w.barrio===slug);
  let h=0,a=0; ps.forEach(p=>{ const g=progresoDe(p); h+=g.hechas; a+=g.total; });
  const sem = ws.filter(w=>w.fecha===now);
  const ordSem = sem.reduce((x,w)=>x+ORDK.reduce((b,k)=>b+(+w[k]||0),0),0);
  const act = ps.filter(p=>p.estado!=="Completada"), con = act.filter(p=>planDe(p,p.ord)).length;
  const {v} = pendientesDe(ps);
  const falta = ROLES.filter(x=>x.id!=="todos" && !sem.some(w=>w.rol===x.id)).map(x=>{ const l=principales(lideresDe(slug,x.id))[0]; return "• "+x.name+(l?" ("+l.nombre+")":""); });
  return [`*Énfasis 2026 · Barrio ${BNAME[slug]}*`, `Semana del domingo ${fmt(now)}`, "",
    `*Personas por nombre:* ${R.personas}`, `En preparación ${R.prep} · Listas ${R.listo} · Completadas ${R.comp}`,
    `*Camino de convenios:* ${a?Math.round(h/a*100):0}% recorrido`, "",
    `*En el año:* ${R.ord} ordenanzas · ${R.ent} entrevistas · ${R.pad} padres apoyados`,
    `*Esta semana:* ${ordSem} ordenanzas · ${sem.reduce((x,w)=>x+(+w.ent||0),0)} entrevistas · ${sem.reduce((x,w)=>x+(+w.pad||0),0)} padres apoyados`, "",
    `*Planes de acción:* ${con} de ${act.length} con plan${v.length?` · ${v.length} vencidos`:""}`,
    ...(falta.length?["", "*Falta anotar esta semana:*", ...falta]:["", "Todo el consejo ya anotó esta semana."])].join("\n");
}
function txtEstaca(er){
  const now = lastSunday();
  const ps = S.personas.filter(p=>!er.org||p.org===er.org);
  const ws = S.semanas.filter(w=>!er.rol||w.rol===er.rol);
  let h=0,a=0; ps.forEach(p=>{ const g=progresoDe(p); h+=g.hechas; a+=g.total; });
  const act = ps.filter(p=>p.estado!=="Completada"), con = act.filter(p=>planDe(p,p.ord)).length;
  const {v} = pendientesDe(ps);
  const ord = ws.reduce((x,w)=>x+ORDK.reduce((b,k)=>b+(+w[k]||0),0),0), ent = ws.reduce((x,w)=>x+(+w.ent||0),0), pad = ws.reduce((x,w)=>x+(+w.pad||0),0);
  const lines = BARRIOS.map(([slug,name])=>{ const bp=ps.filter(p=>p.barrio===slug); const ok = er.rol ? ws.some(w=>w.barrio===slug&&w.fecha===now) : ROLES.filter(x=>x.id!=="todos").every(x=>ws.some(w=>w.barrio===slug&&w.rol===x.id&&w.fecha===now));
    return `• ${name}: ${bp.length} personas · ${bp.filter(p=>p.estado!=="Completada"&&planDe(p,p.ord)).length} con plan · ${ok?"anotó ✓":"falta anotar"}`; });
  return [`*Énfasis 2026 · Estaca de Sión Mérida*`, er.id==="todos"?"Vista general":er.name, `Semana del domingo ${fmt(now)}`, "",
    `*Personas por nombre:* ${ps.length} (En preparación ${ps.filter(p=>p.estado==="En preparación").length} · Listas ${ps.filter(p=>p.estado==="Listo").length} · Completadas ${ps.filter(p=>p.estado==="Completada").length})`,
    `*Camino de convenios:* ${a?Math.round(h/a*100):0}% recorrido`,
    `*En el año:* ${er.id==="todos"||er.rol==="obispado"?ord+" ordenanzas · ":""}${ent} entrevistas · ${pad} padres apoyados`,
    `*Planes de acción:* ${con} de ${act.length} con plan${v.length?` · ${v.length} vencidos`:""}`, "", "*Por barrio:*", ...lines].join("\n");
}

/* ---------- portada ---------- */
function showCover(){
  const el = document.createElement("div"); el.className="cover"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Portada");
  el.innerHTML = `<div class="in">
    ${logoSVG("cover-clip", true)}
    <p class="ctag">Énfasis del Área del Caribe 2026<br>Ministrar uno a uno a través de ordenanzas y convenios</p>
    <button class="enter" id="enterbtn" type="button">Entrar <span aria-hidden="true">→</span></button>
  </div>`;
  document.body.appendChild(el);
  document.body.style.overflow="hidden";
  // Las montañas se mueven un poco con el mouse o el dedo (cada capa a distinta velocidad)
  const layers = el.querySelectorAll(".px");
  let raf=0;
  const move = (cx, cy) => { cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{
    const dx=(cx/window.innerWidth-.5)*2, dy=(cy/window.innerHeight-.5)*2;
    layers.forEach(g=>{ const d=+g.dataset.d; g.setAttribute("transform",`translate(${(-dx*d).toFixed(1)} ${(-dy*d*.5).toFixed(1)})`); }); }); };
  const reduce = (()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
  if (!reduce){
    el.addEventListener("pointermove", e=>move(e.clientX,e.clientY));
    // sin mouse: un vaivén suave y lento
    let t0=performance.now(), alive=true, idle=true;
    el.addEventListener("pointermove", ()=>{ idle=false; }, {once:true});
    const drift = now => { if(!alive) return; if(idle){ const t=(now-t0)/1000; move(window.innerWidth*(.5+.35*Math.sin(t*.5)), window.innerHeight*(.5+.2*Math.cos(t*.4))); } requestAnimationFrame(drift); };
    setTimeout(()=>requestAnimationFrame(drift), 1800);
    el._stop = () => { alive=false; };
  }
  const btn = el.querySelector("#enterbtn");
  setTimeout(()=>{ try{ btn.focus({preventScroll:true}); }catch(e){} }, 1900);
  btn.addEventListener("click", ()=>{
    applyMode(currentMode()); render();
    el.classList.add("out"); el._stop && el._stop();
    document.body.style.overflow="";
    setTimeout(()=>el.remove(), 650);
  });
}

  }
  setConn();
  const onErr = e => { if (e?.code==="revoked"){ S.dbState="none"; } else { S.dbState="error"; } setConn(); render(); };
  db.collection("personas").onSnapshot(snap=>{
    S.personas = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>BNAME[p.barrio]);
    S.loadedP = true; if (!document.querySelector(".overlay")) render();
  }, onErr);
  db.collection("lideres").onSnapshot(snap=>{
    S.lideres = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(l=>BNAME[l.barrio]||l.barrio==="estaca");
    S.loadedL = true;
    if (!(S.tab==="barrio" && S.sub==="semana" && S.dirty) && !document.querySelector(".overlay")) render();
  }, onErr);
  db.collection("semanas").onSnapshot(snap=>{
    S.semanas = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(w=>BNAME[w.barrio]);
    S.loadedW = true;
    // no pisar lo que el líder está escribiendo
    if (!(S.tab==="barrio" && S.sub==="semana" && S.dirty) && !document.querySelector(".overlay")) render();
  }, onErr);
})();
})();
</script>
